apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: enterprise-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: enterprise-ai-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: OLLAMA_HOST
            value: "http://ollama:11434"